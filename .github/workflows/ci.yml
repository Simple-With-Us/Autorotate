name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify release credential and archive guards
        run: |
          bash -n scripts/ios-stage-asc-key.sh scripts/ios-appstore-gm-prepare.sh scripts/apple-testflight-release.sh
          bash scripts/test-ios-stage-asc-key.sh
          bash scripts/test-ios-gm-prepare-cleanup.sh
          python3 scripts/test-apple-release.py

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm 11 (npm 10 exit-handler crash on this lockfile)
        run: npm install -g npm@11.6.2

      - name: Install, typecheck, lint, test, build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run lint
          npm test
          npm run build

  apple:
    name: Apple (AutorotateCore + iOS + macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            echo "Xcode_26.app not found, keeping default: $(xcode-select -p)"
            xcode-select -p
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & test AutorotateCore (SwiftPM)
        working-directory: apple/AutorotateCore
        run: |
          swift build
          swift test

      - name: Verify bundle-ID migration contract
        run: python3 scripts/test-bundle-id-migration.py

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Build iOS app
        run: >-
          xcodebuild -project apple/Autorotate.xcodeproj -scheme Autorotate-iOS
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO

      - name: Build macOS app
        run: >-
          xcodebuild -project apple/Autorotate.xcodeproj -scheme Autorotate-macOS
          -destination 'platform=macOS'
          build CODE_SIGNING_ALLOWED=NO

  android:
    name: Android Companion App (android/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # AR31-34 (2026-09-20): the previous job only ran `assembleDebug`,
      # which compiles but never runs the unit tests.  A regression in
      # SecretStore / QRPairingParser / etc. could ship undetected.  Add
      # the JUnit suite as a required CI step so a broken assertion blocks
      # the PR.
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android App (Assemble Debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

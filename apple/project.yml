# =============================================================================
# Autorotate — XcodeGen project spec (apple/project.yml)
#
# Generates Autorotate.xcodeproj containing the Apple-platform app targets, all
# linking the local SwiftPM package AutorotateCore (no third-party deps).
#
#   brew install xcodegen
#   cd apple && xcodegen generate
#   open Autorotate.xcodeproj
#
# Capabilities to enable in Xcode after generating (Signing & Capabilities):
#   - Keychain Sharing: $(AppIdentifierPrefix)codes.autorotate.shared
#     (already declared in Autorotate-iOS/Autorotate.entitlements)
#   - App Groups: group.codes.autorotate (declared in both app entitlements)
#   - Associated Domains: autorotate.codes (declared in iOS entitlements only;
#     value webcredentials:autorotate.codes; applinks is deferred until tested URL routing exists)
#   - Background Modes: "Background fetch" (matches Info.plist)
#   - Push Notifications: NOT needed (notifications are local-only)
#
# Both app targets (iOS + macOS) are defined below.
# =============================================================================

name: Autorotate
options:
  bundleIdPrefix: codes.autorotate
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  AutorotateCore:
    path: AutorotateCore
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "8.44.0"

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift toolchain language mode
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG
    # Native Sentry. Empty unless xcodebuild/CI passes SENTRY_DSN=...
    # Do not put a live DSN in this file or in Info.plist.
    # iOS (autorotate): inject Infisical SENTRY_DSN into SENTRY_DSN.
    # Mac (autorotate-macos): inject Infisical SENTRY_DSN_MACOS into SENTRY_DSN.
    SENTRY_DSN: ""

targets:

  # ── iOS app ────────────────────────────────────────────────────────────────
  Autorotate-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Autorotate-iOS
        excludes:
          - "Autorotate.entitlements"
          - "Info.plist"
    dependencies:
      - package: AutorotateCore
        product: AutorotateCore
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.autorotate.ios
        # First release under the new bundle starts a fresh 1.0.N train.
        MARKETING_VERSION: "1.0.1"
        PRODUCT_NAME: Autorotate
        CODE_SIGN_ENTITLEMENTS: Autorotate-iOS/Autorotate.entitlements
        INFOPLIST_FILE: Autorotate-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Autorotate
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CC8UTF7ATG

  # ── macOS app ──────────────────────────────────────────────────────────────
  Autorotate-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Autorotate-macOS
        excludes:
          - "AutorotateMac.entitlements"
          - "Info.plist"
    dependencies:
      - package: AutorotateCore
        product: AutorotateCore
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.autorotate.macos
        PRODUCT_NAME: Autorotate
        CODE_SIGN_ENTITLEMENTS: Autorotate-macOS/AutorotateMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        # Custom SENTRY_DSN key does not merge from INFOPLIST_KEY_* .
        # Empty unless xcodebuild/CI passes SENTRY_DSN=... (Infisical
        # SENTRY_DSN_MACOS).  Do not put a live DSN in git.
        INFOPLIST_FILE: Autorotate-macOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Autorotate
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: CC8UTF7ATG

schemes:
  Autorotate-macOS:
    build:
      targets:
        Autorotate-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Autorotate-iOS:
    build:
      targets:
        Autorotate-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
